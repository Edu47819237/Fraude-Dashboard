<!DOCTYPE html>
<html>

<head>
    <title>Dashboard AXB</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            margin:0;
            padding:20px;
        }

        .titulo{
            color:#0057B8;
        }

        .contenedor{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        }

        .kpi{
            background:white;
            border-radius:15px;
            width:250px;
            padding:20px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        .numero{
            font-size:40px;
            font-weight:bold;
            color:#0057B8;
        }

    </style>

</head>

<body>

    <h1 class="titulo">
        Dashboard AXB
    </h1>

    <div class="contenedor">

        <div class="kpi">
            <h3>Ventas</h3>
            <div class="numero">1520</div>
        </div>

        <div class="kpi">
            <h3>Morosos</h3>
            <div class="numero">245</div>
        </div>

        <div class="kpi">
            <h3>Alertas</h3>
            <div class="numero">83</div>
        </div>

    </div>

</body>

</html>
